preserve_hierarchy: true

files:
  - source: /src/generated/resources/assets/hbm_m/lang/en_us.json
    # Переводы кладём в main/resources — туда датаген (runData) не пишет и не чистит,
    # поэтому Crowdin-файлы не будут затираться при перегенерации. Источник (en_us)
    # по-прежнему берётся из generated, обе папки попадают в финальный JAR.
    translation: /src/main/resources/assets/hbm_m/lang/%locale_with_underscore%.json

    ignore:
      - /src/main/resources/assets/hbm_m/lang/ru_ru.json

