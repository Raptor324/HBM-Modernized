name: Create Release and Upload Build

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract version from tag
        id: get_version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Set active stonecutter project
        run: ./gradlew "Set active project to 1.20.1-forge" -q --console=plain --warning-mode=none

      - name: Generate Data with Gradle
        run: ./gradlew :1.20.1-forge:runData -Pmod.version=${{ steps.get_version.outputs.version }} -q --console=plain --warning-mode=none

      - name: Build Forge 1.20.1
        run: ./gradlew :1.20.1-forge:build -Pmod.version=${{ steps.get_version.outputs.version }} -q --console=plain --warning-mode=none

      - name: Get JAR file path
        id: get_jar
        run: |
          JAR_PATH=$(find versions/1.20.1-forge/build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            echo "::error::Release JAR not found in versions/1.20.1-forge/build/libs"
            exit 1
          fi
          echo "path=$JAR_PATH" >> $GITHUB_OUTPUT
          echo "Found JAR: $JAR_PATH"

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.get_jar.outputs.path }}
          name: "HBM Modernized ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
