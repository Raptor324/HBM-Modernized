name: Data Generation

# Перегенерирует assets/recipes/tags/локализацию (en_us, ru_ru) через ./gradlew runData
# и открывает PR в main. Прямой пуш в main запрещён rule set репозитория,
# поэтому датаген отдаёт результат через pull request (как и Crowdin).

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'src/generated/**'                        # Чтобы не зациклить экшен после мерджа датаген-PR
      - 'src/main/resources/assets/hbm_m/lang/**' # Переводы от Crowdin — датаген не нужен
      - '.github/**'
      - '*.md'
  workflow_dispatch: # Ручной запуск из вкладки Actions

permissions:
  contents: write       # коммит в ветку datagen/auto
  pull-requests: write  # создание/обновление PR

jobs:
  run-datagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set active stonecutter project
        run: ./gradlew "Set active project to 1.20.1-forge" -q --console=plain --warning-mode=none

      - name: Run Data Generator
        run: ./gradlew :1.20.1-forge:runData -q --console=plain --warning-mode=none

      # Создаёт PR только если runData что-то изменил. Если diff пустой — шаг no-op.
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Auto-generate resources [skip ci]"
          branch: datagen/auto
          delete-branch: true
          title: "chore: regenerate data resources"
          body: |
            Автоматический PR: перегенерированные ассеты/рецепты/теги/локализация (`en_us`, `ru_ru`).

            Создан экшеном `.github/workflows/datagen.yml` после изменений в исходниках.
          # Коммитим только то, что нагенерировал runData.
          add-paths: |
            src/generated/*
